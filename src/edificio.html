     edificio.html — EL EDIFICIO SATORI · modulo LAZY de la escena de Akasha
     Generado desde AKASHA-EDIFICIO-v4.html (maqueta certificada por render, Cowork 10-ago-2026)
     por _edificio/extraer.py + _edificio/ensamblar.py.
     NO EDITAR A MANO: se regenera con `bash _gen_edificio.sh` (y ese script corre el harness).

     QUE ES. La torre de 8 plantas que cuelga DEBAJO del universo de Akasha. No es una vista
     aparte ni un segundo modo: es la MISMA escena, el MISMO renderer y el MISMO loop. Bajas del
     orbe y estas en el Edificio. (Correccion de concepto de Luciano, adenda del 10-ago: no hay
     toggle; el Edificio ES el Akasha nuevo.)

     COMO SE ENGANCHA. Todo entra por `window.__AK_EXT`, la unica costura abierta en la clausura
     de `__buildAkashaEngine`. Este archivo NO crea renderer, ni escena, ni camara, ni loop, ni
     listeners de canvas: los toma prestados. Asi se cumple por construccion el invariante del
     gate E2 (index.html L6439): renderer propio del canvas #gl, un solo loop de render a la vez.

     COMO SE CARGA. No esta inlineado en index.html a proposito: index ya pesa ~960KB y esto suma
     ~300KB (240KB son los avatares base64). Inlinearlo le cobraria ese peso a cada carga del
     Centro de Mando, entres o no al Edificio — justo el TTFP que afino E3.7. Lo sirve
     `moduloEdificio()` (32_flota.js) y el hook lo pide la primera vez que se desciende.

     LO QUE SE DESCARTO DE v4 Y POR QUE:
       · renderer / escena / camara / domo / polvo / env PMREM / luces base → los pone Akasha.
       · el UNIVERSO de v4 (orbe + anillo + 7 clientes demo) → Akasha YA lo dibuja con
         `listaClientes` real. Duplicarlo seria inventar una cartera al lado de la verdadera.
         Del bloque solo sobrevive el HAZ conector, que si es nuevo.
       · los listeners de pointer/wheel/touch → los de Akasha ya cubren orbita y zoom; el modulo
         solo suma el descenso vertical.
       · las sombras (`shadowMap.enabled`) → encenderlas en el renderer COMPARTIDO recompila los
         materiales de todo el universo y agrega un pase por luz. Los `castShadow` de los meshes

/* texturas por canvas */
function tex(fn,w=256,h=256,rep=1){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  fn(cv.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);
  t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  return t;
}
function carpetTex(base,accent){
  return tex((g,w,h)=>{
    g.fillStyle=base;g.fillRect(0,0,w,h);
    for(let i=0;i<2600;i++){
      g.fillStyle=Math.random()<.5?'rgba(255,255,255,.022)':'rgba(0,0,0,.05)';
      g.fillRect(Math.random()*w,Math.random()*h,1.6,1.6);
    }
    g.strokeStyle='rgba(255,255,255,.045)';g.lineWidth=1;
    for(let x=0;x<=w;x+=64){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}
    for(let y=0;y<=h;y+=64){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
    g.strokeStyle=accent;g.globalAlpha=.16;g.lineWidth=2;
    g.strokeRect(8,8,w-16,h-16);g.globalAlpha=1;
  },256,256,3);
}
function screenTexFactory(accCss){
  return tex((g,w,h)=>{
    g.fillStyle='#0d1512';g.fillRect(0,0,w,h);
    g.fillStyle=accCss;g.globalAlpha=.9;g.fillRect(0,0,w,7);g.globalAlpha=1;
    /* líneas de log */
    for(let i=0;i<9;i++){
      const y=20+i*13;
      g.fillStyle=i%3===0?accCss:'rgba(236,234,227,.5)';
      g.globalAlpha=i%3===0?.85:.45;
      g.fillRect(10,y,30+((i*53)%68),4);g.globalAlpha=1;
    }
    /* sparkline */
    g.strokeStyle=accCss;g.lineWidth=2.4;g.beginPath();
    for(let x=0;x<=100;x+=10){
      const y=176-((Math.sin(x*.38)+1)*16+((x*13)%17));
      x===0?g.moveTo(14+x,y):g.lineTo(14+x,y);
    }
    g.stroke();
    /* barras */
    for(let i=0;i<6;i++){g.fillStyle=accCss;g.globalAlpha=.5+.5*((i*7)%10)/10;
      g.fillRect(150+i*15,190-((i*37)%52)-14,9,((i*37)%52)+14);}
    g.globalAlpha=1;
  },256,224,1);
}
const glowTex=(()=>{const cv=document.createElement('canvas');cv.width=cv.height=128;
  const g=cv.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(cv);return t;})();
function glow(color,size){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false,opacity:.85}));
  s.scale.set(size,size,1);return s;
}

function labelSprite(text,accCss){
  const cv=document.createElement('canvas');cv.width=1024;cv.height=112;

  g.fillStyle='rgba(16,16,11,.78)';
  const wtxt=g.measureText('');g.font='600 44px -apple-system,Segoe UI,Roboto,sans-serif';
  const tw=g.measureText(text).width+86;
  g.beginPath();g.moveTo(28,8);g.arcTo(tw,8,tw,104,28);g.arcTo(tw,104,28,104,28);g.arcTo(8,104,8,8,28);g.arcTo(8,8,tw,8,28);g.fill();
  g.fillStyle=accCss;g.beginPath();g.arc(44,56,12,0,7);g.fill();
  g.fillStyle='#ECEAE3';g.textBaseline='middle';g.fillText(text,72,58);
  const tx=new THREE.CanvasTexture(cv);tx.encoding=THREE.sRGBEncoding;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true,depthWrite:false,opacity:.96}));

}

  g.globalAlpha=1;g.fillStyle='#fff';g.beginPath();
  for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2;const r=i%2?7:17;g.lineTo(w*0.5+Math.cos(a)*r,h*0.62+Math.sin(a)*r);}

  carpet.position.y=TH/2+.55;carpet.receiveShadow=true;fg.add(carpet);
  /* línea LED de acento en el canto */
  [[-1,0,D,1],[1,0,D,1],[0,-1,W,0],[0,1,W,0]].forEach(([sx,sz,len,rot])=>{
    const led=new THREE.Mesh(new THREE.BoxGeometry(rot?1.1:len,1.1,rot?len:1.1),

  });
  const ledG=glow(acc,30);ledG.position.set(-W/2,TH/2,0);ledG.material.opacity=.14;fg.add(ledG);
  /* columnas + baranda de vidrio (laterales despejados) */
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,sz])=>{
    const col=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.9,GAP-9,10),M.metal);
    col.position.set(sx*(W/2-7),(GAP-9)/2+TH/2,sz*(D/2-7));col.castShadow=true;
    fg.add(col);
  });
  [[0,-1,W-14,0],[0,1,W-14,0],[-1,0,D-14,1],[1,0,D-14,1]].forEach(([sx,sz,len,rot])=>{
    const rail=new THREE.Mesh(new THREE.PlaneGeometry(len,6.5),M.glass);
    rail.position.set(sx*(W/2-7),TH/2+3.4,sz*(D/2-7));
    if(rot)rail.rotation.y=Math.PI/2;
    fg.add(rail);
    const railTop=new THREE.Mesh(new THREE.BoxGeometry(rot?1:len,.5,rot?len:1),M.metal);
    railTop.position.set(sx*(W/2-7),TH/2+6.9,sz*(D/2-7));fg.add(railTop);

  /* etiqueta */
  const lab=labelSprite('P'+p.id+' · '+p.nom.toUpperCase(),CSSC[p.c]);
  lab.position.set(-W/2-52,12,D/2+16);fg.add(lab);

  /* mobiliario */
  const n=p.ags.length;
  if(p.id===8){buildDespacho(fg,acc,p);}
  else if(p.sala){
    const table=new THREE.Mesh(new THREE.CylinderGeometry(48,48,2.4,48),
      (()=>{const m=new THREE.MeshStandardMaterial({color:0x26261e,roughness:.3,metalness:.55});m.envMapIntensity=.38;return m;})());
    table.scale.z=.6;table.position.y=7;table.castShadow=true;table.receiveShadow=true;fg.add(table);
    const tRing=new THREE.Mesh(new THREE.TorusGeometry(49,.6,8,80),
      new THREE.MeshBasicMaterial({color:acc,transparent:true,opacity:.85}));
    tRing.rotation.x=Math.PI/2;tRing.scale.y=.6;tRing.position.y=8.4;fg.add(tRing);
    /* holograma central */
    const holo=new THREE.Mesh(new THREE.ConeGeometry(9,16,4,1,true),
      new THREE.MeshBasicMaterial({color:acc,transparent:true,opacity:.14,side:THREE.DoubleSide,wireframe:true}));
    holo.position.y=18;fg.add(holo);fg.userData={holo};
    const hglow=glow(acc,34);hglow.position.y=20;hglow.material.opacity=.3;fg.add(hglow);
    p.ags.forEach((a,i)=>{
      const ang=i/n*Math.PI*2;
      const u=seatUnit(a,acc);u.scale.setScalar(1.18);
      u.position.set(Math.cos(ang)*64,TH/2,Math.sin(ang)*42);
      u.rotation.y=-ang-Math.PI/2;
      const hit=new THREE.Mesh(new THREE.CylinderGeometry(5,5,20,8),
        new THREE.MeshBasicMaterial({visible:false}));
      hit.position.set(u.position.x,12,u.position.z);
      hit.userData={type:'agent',pid:p.id,idx:i};
      fg.add(u,hit);pickAgents.push(hit);
      a._unit=u;
    });
    fg.add(plantPot(-W/2+16,-D/2+16,true),plantPot(W/2-16,D/2-16,true));
  } else {
    const cols=Math.min(5,Math.max(2,Math.ceil(Math.sqrt(n*1.6))));
    const rows=Math.ceil(n/cols);
    const dx=Math.min(44,(W-58)/cols),dz=Math.min(38,(D-52)/rows);
    p.ags.forEach((a,i)=>{
      const cx=i%cols,rz=Math.floor(i/cols);
      const u=deskUnit(a,acc);u.scale.setScalar(1.22);
      u.position.set((cx-(cols-1)/2)*dx,TH/2,(rz-(rows-1)/2)*dz);
      const hit=new THREE.Mesh(new THREE.BoxGeometry(18,24,15),
        new THREE.MeshBasicMaterial({visible:false}));

  }
  floorGroups.push(fg);tower.add(fg);
});

/* núcleo dorado (Cerebro): columna de datos */
const CORE_X=W/2+42,COREH=8*GAP+44;
const coreGeo=new THREE.BufferGeometry();
const NP=520,cp=new Float32Array(NP*3),cs=new Float32Array(NP);
for(let i=0;i<NP;i++){
  const a=Math.random()*Math.PI*2,r=4+Math.random()*15;
  cp[i*3]=Math.cos(a)*r;cp[i*3+1]=Math.random()*COREH-8;cp[i*3+2]=Math.sin(a)*r;
  cs[i]=Math.random();
}
coreGeo.setAttribute('position',new THREE.BufferAttribute(cp,3));
const core=new THREE.Points(coreGeo,new THREE.PointsMaterial({color:0xD4A857,size:1.5,map:glowTex,transparent:true,opacity:.5,
  blending:THREE.AdditiveBlending,depthWrite:false}));
core.position.x=CORE_X;tower.add(core);
const coreBeam=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,COREH,16,1,true),
  new THREE.MeshBasicMaterial({color:0xD4A857,transparent:true,opacity:.08,blending:THREE.AdditiveBlending,depthWrite:false}));
coreBeam.position.set(CORE_X,COREH/2-8,0);tower.add(coreBeam);
const coreGlow=glow(0xD4A857,44);coreGlow.position.set(CORE_X,COREH*.55,0);coreGlow.material.opacity=.14;tower.add(coreGlow);


/* ── Layout de la torre (portado de v4, sin la parte del universo: ese lo pone Akasha). Reparte
   los pisos segun el gap vigente y estira el nucleo dorado para que los acompañe. ── */
function layoutTower(){
  PISOS.forEach(function(p,i){ floorGroups[i].position.y=(p.id-1)*gapCur; });
  var h=8*gapCur+44;
  core.scale.y=h/COREH; coreBeam.scale.y=h/COREH; coreGlow.position.y=h*0.55;
  /* coreLight vive FUERA del grupo escalado (ver nota de escala): su posicion va en mundo. */
  if(coreLight) coreLight.position.set((CORE_X-10)*EDI.K, tower.position.y + 4*gapCur*EDI.K, 50*EDI.K);
}

/* ── Ubicacion: la torre cuelga del universo. Alto real = 8 pisos * GAP * K. ── */
var ALTO_TORRE = 8*GAP*EDI.K;
function ubicarTorre(){
  tower.scale.setScalar(EDI.K);
  tower.position.set(0, EDI.TECHO - ALTO_TORRE, 0);   /* base abajo, techo en EDI.TECHO */
  if(coreLight) coreLight.distance = 900*EDI.K;       /* el `distance` no hereda escala del padre */
  /* Cuánto se puede bajar con shift+arrastrar. El engine no sabe cuánto mide la torre: se lo dice
     el módulo. Un poco más abajo de la planta baja, para que el lobby no quede pegado al borde. */
  EXT.nav.ovYMin = EDI.TECHO - ALTO_TORRE - 6;
}

/* ── Luces propias del Edificio. Fuera del grupo (ver nota de escala) y sin sombras (ver
   cabecera). Se suman a las de Akasha: el universo de arriba no cambia de aspecto. ── */
var sun = new THREE.DirectionalLight(0xffeeda, 0.85);
sun.position.set(60, 40, 42);
var rim = new THREE.DirectionalLight(0x4FB89C, 0.22);
rim.position.set(-66, 20, -56);
var coreLight = new THREE.PointLight(0xD4A857, 1.2, 900*EDI.K, 1.8);
var extras = new THREE.Group(); extras.add(sun, rim, coreLight);   /* sin escala: luces + haz */

/* ── Haz dorado que cose el orbe con la torre: continuidad del Cerebro, no adorno. Arranca bajo
   el Nucleo de Akasha (y=10) y baja hasta el techo de la torre. ── */
var beamLen = Math.max(2, 6 - EDI.TECHO);
var univBeam = new THREE.Mesh(
  new THREE.CylinderGeometry(0.5, 1.5, 1, 16, 1, true),
  new THREE.MeshBasicMaterial({color:0xD4A857, transparent:true, opacity:0.09,   /* suavizado a la par del nucleo (v4, 10-ago) */
    blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide}));
function ubicarHaz(){
  beamLen = Math.max(2, 6 - EDI.TECHO);
  univBeam.scale.y = beamLen;
  univBeam.position.set(0, 6 - beamLen/2, 0);
}

/* ── CAMARA. No hay sistema de camara propio: se conduce el `nav` de Akasha por el seam. El
   descenso es `nav.ovY` (offset vertical del centro de orbita, 0 = universo). Con ovY=0 el
   comportamiento del overview es identico al de hoy — el Edificio no cambia como se ve arriba. */
var Y_PISO_1 = EDI.TECHO - ALTO_TORRE;
function yDePiso(pid){ return Y_PISO_1 + (pid-1)*GAP*EDI.K*(gapCur/GAP); }
function focusUniverse(){ EXT.navOverview({ovY:0, radio:58, alt:18}); }
/* radio 58 / alt 15 y no 30/7: la torre mide ~78 unidades de alto y a radio 30 la camara queda
   DENTRO de ella — se ve una pared, no una planta. Alejarla la deja apreciable entera. */

/* La cartera del panel del Universo NO se inventa: sale de la misma `listaClientes` que dibuja
   los Espacios de Cliente de Akasha. Si el seam no la expone, se dice — no se rellena. */
function carteraReal(){
  var cs = (EXT.clientes && EXT.clientes()) || [];
  if(!cs.length) return '<div class="e-agent" style="cursor:default"><span class="e-rl">'+
    'La cartera todav\u00eda no lleg\u00f3 del server.</span></div>';
  return cs.map(function(c){
    var st = c.estado==='activo'||c.estado==='activo-piloto' ? 'g' : (c.estado==='pausado'?'y':'b');
    return '<div class="e-agent" style="cursor:default"><span class="e-nm"><span class="e-st '+st+
      '"></span>'+esc(c.nombre||'')+'</span><span class="e-rl">'+esc(c.id||'')+
      ' \u00b7 Espacio de Cliente</span></div>';
  }).join('');
}
function setGlow(a,on){
  if(!a._unit)return;
  const u=a._unit.userData;
  if(u.halo)u.halo.scale.setScalar(on?1.9:1);
  if(u.hglow)u.hglow.material.opacity=on?1:.85;
}

/* mini-gráficos SVG (demo determinística) */
function seedArr(name,n,base,amp){
  let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))>>>0;
  const out=[];for(let i=0;i<n;i++){h=(h*1103515245+12345)>>>0;out.push(base+((h>>16)%1000)/1000*amp);}
  return out;
}
function spark(name,color,w=72,h=26){
  const d=seedArr(name,14,.25,.7);
  const pts=d.map((v,i)=>`${(i/(d.length-1)*w).toFixed(1)},${(h-v*h).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round"/></svg>`;
}
function area(name,color,w=340,h=88){
  const d=seedArr(name+'a',30,.2,.75);
  const pts=d.map((v,i)=>[i/(d.length-1)*w,h-6-v*(h-14)]);
  const line=pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ');
  const areaPts=line+` ${w},${h} 0,${h}`;
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">
    <polygon points="${areaPts}" fill="${color}" opacity=".12"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.8"/>
  </svg>`;
}
function donut(segs){
  const R=34,CIRC=2*Math.PI*R;let off=0;
  const rings=segs.map(s=>{
    const len=s.v/100*CIRC;
    const el=`<circle r="${R}" cx="44" cy="44" fill="none" stroke="${s.c}" stroke-width="11"
      stroke-dasharray="${len.toFixed(1)} ${(CIRC-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 44 44)"/>`;
    off+=len;return el;
  }).join('');
  return `<svg width="88" height="88" viewBox="0 0 88 88" aria-hidden="true">${rings}</svg>`;
}

/* ── DATOS REALES: el semaforo de la torre lo manda el server, no el roster estatico.
   `flotaEstado()` (32_flota.js) es un lector puro de la flota PROPIA de Satori — ni una hoja de
   tenant. Los 68 del roster son mayormente persona-skills sin runtime: a esos NO se les inventa
   un estado, se quedan con el suyo. Solo se pisan los que tienen clave real. ── */
var EDI_RUNTIME = {
  'Sato':'sato', 'Director':'director', 'Admin propia':'admin', 'Salud':'salud',
  'Bandeja':'bandeja', 'Cerebro':'cerebro', 'Vigilancia':'vigilancia',
  'Conectores':'conectores', 'Lift (retenci\u00f3n)':'lift'
};
var FLOTA = null;
function aplicarFlota(f){
  if(!f) return;
  FLOTA=f;
  var porClave={};
  (f.runtime||[]).concat(f.modulos||[]).forEach(function(r){ porClave[r.clave]=r; });
  PISOS.forEach(function(p){ p.ags.forEach(function(a){
    var k=EDI_RUNTIME[a.n]; if(!k) return;
    var r=porClave[k]; if(!r) return;
    a.st=r.estado; a._k=k; a._live=r;          /* _live: procedencia para el panel y el dash */
    if(a._unit) pintarUnidad(a);
  }); });
  if(SEL!==null){ var p=PISOS.filter(function(x){return x.id===SEL;})[0]; if(p) renderPanel(p); }
}
function pintarUnidad(a){
  var u=a._unit&&a._unit.userData?a._unit.userData:a._unit; if(!u) return;
  var col=ST_HEX[a.st]||ST_HEX.b;
  if(u.hglow&&u.hglow.material&&u.hglow.material.color) u.hglow.material.color.setHex(col);
  if(u.halo&&u.halo.material&&u.halo.material.color) u.halo.material.color.setHex(col);
}
function cargarFlota(){
  if(!EXT.rpc) return;
  EXT.rpc('flotaEstado', [], function(f){ aplicarFlota(f); }, function(){ /* sin datos: el roster
    estatico se queda como esta y el panel lo dice; no se pinta un verde falso */ });
}

/* ── DASHBOARD CON DATOS REALES (encargo §4: on-demand, NO preload).
   El dash que trae la maqueta muestra KPIs ilustrativos, y lo dice. Para los agentes que TIENEN
   runtime se pide `agenteDetalle(clave)` al abrirlo — nunca antes: son 68 agentes y precargarlos
   seria 68 lecturas de Sheets para mirar uno. Los que no tienen runtime (las persona-skills del
   Circulo, el Consejo, Equipo Pro, Bastion) NO llaman al endpoint: no tienen nada que leer, y su
   ficha estatica ya dice lo que se sabe de ellos. Mejor un panel que admite "no consume hasta que
   se lo convoca" que uno que inventa una metrica. ── */
function _kpi(lb, val, det, dir){
  return '<div class="e-kpi"><span class="e-lb">'+esc(lb)+'</span><b>'+esc(val)+
         '</b><span class="e-dl e-'+(dir||'fl')+'">'+esc(det)+'</span></div>';
}
function pintarDetalleReal(a, d){
  if(!d) return;
  var caja=dash.querySelector('.e-kpis');
  if(caja){
    var costo = d.costoMes && d.costoMes.usd ? ('$'+d.costoMes.usd.toFixed(2)) : '$0.00';
    var ult   = d.ultimaCorrida || 'sin registro';
    var cupo  = d.cupo ? (d.cupo.usado+'/'+d.cupo.max) : '—';
    caja.innerHTML =
      _kpi('Corridas 30d', String(d.corridas30d), 'hoja Actividad', d.corridas30d?'up':'fl') +
      _kpi('Última corrida', ult, d.diasDesdeCorrida==null?'nunca registrada':('hace '+d.diasDesdeCorrida+'d'), d.diasDesdeCorrida===0?'up':'fl') +
      _kpi('Costo del mes', costo, 'Costos_API · '+(d.costoMes?d.costoMes.mes:''), 'fl') +
      (d.tipo==='runner'
        ? _kpi('Cupo diario', cupo, d.cupo&&d.cupo.ok?'dentro del cupo':'cupo alcanzado', d.cupo&&d.cupo.ok?'up':'fl')
        : _kpi('Tipo', 'Módulo', d.rol||'', 'fl'));
  }
  /* El pie deja de ser un descargo genérico y pasa a declarar de dónde salió cada número
     (regla §7 del aislamiento: una cifra sin procedencia no se muestra). */
  var pie=dash.querySelector('.e-d-demo');
  if(pie && d.fuentes){
    pie.innerHTML = '<b>Datos reales</b> · corridas: '+esc(d.fuentes.corridas)+
      ' · costo: '+esc(d.fuentes.costo)+(d.fuentes.cupo?(' · cupo: '+esc(d.fuentes.cupo)):'')+
      '. El pulso y el mix de abajo siguen siendo ilustrativos.';
  }
}
var _openDashBase = openDash;
openDash = function(p, a){
  _openDashBase(p, a);
  if(!a || !a._k || !EXT.rpc) return;      /* persona-skill: sin runtime, no hay nada que pedir */
  EXT.rpc('agenteDetalle', [a._k], function(d){
    /* Puede haber cerrado el dash o abierto otro mientras volvía: solo pinta si sigue siendo éste. */
    if(!dash.classList.contains('e-open')) return;
    try{ pintarDetalleReal(a, d); }catch(e){ try{console.error('[Edificio] detalle',e);}catch(_x){} }
  }, function(){ /* sin datos: quedan los KPIs de la ficha estática, que ya se declaran ilustrativos */ });
};

/* ── POST cinematografico. Detras de flag con rollback instantaneo (adenda §5): cambia
   `outputEncoding` y `toneMapping` del renderer COMPARTIDO, o sea que le toca la cara al universo
   de arriba tambien. Arranca APAGADO hasta que Luciano lo mire; se prende con
   `ediPost(true)` o localStorage `ak_post=1`. ── */
var POSTFX=null, postOn=false, _encPrev=null, _tmPrev=null;
function construirPost(){
  if(POSTFX) return POSTFX;
  /* ── Pipeline de post-proceso hand-written (sin addons — bloqueados en sandbox):
       escena→RT lineal (+depth) → bright-pass → blur separable ×2 octavas →
       composite final con AO por profundidad + DoF (bokeh) + ACES + viñeta + grano ── */
  const POST=(function(){
    const isGL2=renderer.capabilities.isWebGL2;
    const opt={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,format:THREE.RGBAFormat,type:THREE.UnsignedByteType};
    const pr=()=>renderer.getPixelRatio();
    let W0=Math.floor(innerWidth*pr()),H0=Math.floor(innerHeight*pr());
    const sceneRT=new THREE.WebGLRenderTarget(W0,H0,Object.assign({depthBuffer:true,stencilBuffer:false},opt));
    const depthTex=new THREE.DepthTexture(W0,H0);
    depthTex.type=isGL2?THREE.UnsignedIntType:THREE.UnsignedShortType;depthTex.format=THREE.DepthFormat;
    sceneRT.depthTexture=depthTex;
    const hw=()=>Math.max(1,Math.floor(W0/2)),hh=()=>Math.max(1,Math.floor(H0/2));
    const qw=()=>Math.max(1,Math.floor(W0/4)),qh=()=>Math.max(1,Math.floor(H0/4));
    const brightRT=new THREE.WebGLRenderTarget(hw(),hh(),opt);
    const blurA=new THREE.WebGLRenderTarget(hw(),hh(),opt), blurB=new THREE.WebGLRenderTarget(hw(),hh(),opt);
    const blurC=new THREE.WebGLRenderTarget(qw(),qh(),opt), blurD=new THREE.WebGLRenderTarget(qw(),qh(),opt);
    const oScene=new THREE.Scene(), oCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
    const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2)); oScene.add(quad);
    const V='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
    const brightMat=new THREE.ShaderMaterial({uniforms:{tD:{value:null},thr:{value:0.60},soft:{value:0.30}},vertexShader:V,
      fragmentShader:'varying vec2 vUv;uniform sampler2D tD;uniform float thr,soft;void main(){vec3 c=texture2D(tD,vUv).rgb;float l=dot(c,vec3(.2126,.7152,.0722));float k=smoothstep(thr-soft,thr+soft,l);gl_FragColor=vec4(c*k,1.);}'});
    const blurMat=new THREE.ShaderMaterial({uniforms:{tD:{value:null},dir:{value:new THREE.Vector2()},res:{value:new THREE.Vector2()}},vertexShader:V,
      fragmentShader:'varying vec2 vUv;uniform sampler2D tD;uniform vec2 dir,res;void main(){vec2 o=dir/res;vec4 s=texture2D(tD,vUv)*0.227;s+=texture2D(tD,vUv+o*1.385)*0.316;s+=texture2D(tD,vUv-o*1.385)*0.316;s+=texture2D(tD,vUv+o*3.231)*0.070;s+=texture2D(tD,vUv-o*3.231)*0.070;gl_FragColor=s;}'});
    const finalMat=new THREE.ShaderMaterial({uniforms:{
        tScene:{value:sceneRT.texture},tBloom:{value:blurB.texture},tBloom2:{value:blurD.texture},tDepth:{value:depthTex},
        res:{value:new THREE.Vector2(W0,H0)},near:{value:1},far:{value:5000},
        bloomK:{value:0.82},aoK:{value:QUAL==='low'?0.0:0.55},dofK:{value:QUAL==='low'?0.0:0.7},focus:{value:600.0},expo:{value:1.12},time:{value:0}},
      vertexShader:V,
      fragmentShader:[
      'varying vec2 vUv;',
      'uniform sampler2D tScene,tBloom,tBloom2,tDepth;',
      'uniform vec2 res;uniform float near,far,bloomK,aoK,dofK,focus,expo,time;',
      'float linz(vec2 uv){float d=texture2D(tDepth,uv).x*2.-1.;return (2.*near*far)/(far+near-d*(far-near));}',
      'vec3 aces(vec3 x){return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.);}',
      'void main(){',
      ' vec2 px=1./res;',
      ' float cz=linz(vUv);',
      ' float fdist=focus;',
      ' float coc=clamp(abs(cz-fdist)/(fdist*3.2),0.,1.)*dofK;',
      ' float rad=coc*2.2;',
      ' vec3 col;',
      ' if(rad<0.5){col=texture2D(tScene,vUv).rgb;}',
      ' else{vec3 a=texture2D(tScene,vUv).rgb;',
      '  a+=texture2D(tScene,vUv+vec2(rad,0.)*px).rgb;a+=texture2D(tScene,vUv+vec2(-rad,0.)*px).rgb;',
      '  a+=texture2D(tScene,vUv+vec2(0.,rad)*px).rgb;a+=texture2D(tScene,vUv+vec2(0.,-rad)*px).rgb;',
      '  a+=texture2D(tScene,vUv+vec2(rad,rad)*px*.7).rgb;a+=texture2D(tScene,vUv+vec2(-rad,-rad)*px*.7).rgb;col=a/7.;}',
      ' float ao=1.;',
      ' if(aoK>0.){float occ=0.;for(int i=0;i<8;i++){float an=float(i)*0.785;vec2 off=vec2(cos(an),sin(an))*2.6*px;float nz=linz(vUv+off);occ+=clamp((cz-nz)/(cz*0.06),0.,1.);}ao=clamp(1.-occ/8.*aoK,0.45,1.);}',
      ' col*=ao;',
      ' vec3 bl=texture2D(tBloom,vUv).rgb+texture2D(tBloom2,vUv).rgb*0.6;',
      ' col+=bl*bloomK;',
      ' col=aces(col*expo);',
      ' float vg=smoothstep(1.05,0.3,length(vUv-0.5));col*=mix(0.62,1.0,vg);',
      ' float g=fract(sin(dot(vUv*res+time,vec2(12.9898,78.233)))*43758.5453);col+=(g-0.5)*0.022;',
      ' col=pow(clamp(col,0.,1.),vec3(0.4545));',
      ' gl_FragColor=vec4(col,1.);',
      '}'].join('\n')});
    function draw(mat,tgt){quad.material=mat;renderer.setRenderTarget(tgt||null);renderer.render(oScene,oCam);}
    function setSize(){
      W0=Math.floor(innerWidth*pr());H0=Math.floor(innerHeight*pr());
      sceneRT.setSize(W0,H0);depthTex.image.width=W0;depthTex.image.height=H0;depthTex.needsUpdate=true;
      brightRT.setSize(hw(),hh());blurA.setSize(hw(),hh());blurB.setSize(hw(),hh());
      blurC.setSize(qw(),qh());blurD.setSize(qw(),qh());
      finalMat.uniforms.res.value.set(W0,H0);
    }
    function render(scn,cam){
      finalMat.uniforms.near.value=cam.near;finalMat.uniforms.far.value=cam.far;
      finalMat.uniforms.time.value=(performance.now()%10000)/1000;
      renderer.setRenderTarget(sceneRT);renderer.render(scn,cam);
      brightMat.uniforms.tD.value=sceneRT.texture;draw(brightMat,brightRT);
      blurMat.uniforms.tD.value=brightRT.texture;blurMat.uniforms.res.value.set(hw(),hh());blurMat.uniforms.dir.value.set(1.4,0);draw(blurMat,blurA);
      blurMat.uniforms.tD.value=blurA.texture;blurMat.uniforms.dir.value.set(0,1.4);draw(blurMat,blurB);
      blurMat.uniforms.tD.value=blurB.texture;blurMat.uniforms.res.value.set(qw(),qh());blurMat.uniforms.dir.value.set(2.4,0);draw(blurMat,blurC);
      blurMat.uniforms.tD.value=blurC.texture;blurMat.uniforms.dir.value.set(0,2.4);draw(blurMat,blurD);
      finalMat.uniforms.tScene.value=sceneRT.texture;finalMat.uniforms.tBloom.value=blurB.texture;finalMat.uniforms.tBloom2.value=blurD.texture;
      draw(finalMat,null);
      renderer.setRenderTarget(null);
    }
    return {render,setSize,setFocus:function(d){finalMat.uniforms.focus.value=d;}};
  })();

  POSTFX = POST; return POSTFX;
}
function ediPost(on){
  on=!!on;
  if(on===postOn) return postOn;
  if(on){
    construirPost();
    _encPrev=renderer.outputEncoding; _tmPrev=renderer.toneMapping;
    renderer.outputEncoding=THREE.LinearEncoding;   /* el shader final hace ACES + sRGB */
    renderer.toneMapping=THREE.NoToneMapping;
    POSTFX.setSize();
    EXT.setRenderHook(function(scn,cam){
      POSTFX.setFocus(cam.position.distanceTo(EXT.nav.look));
      POSTFX.render(scn,cam);
    });
  } else {
    EXT.setRenderHook(null);
    if(_encPrev!=null) renderer.outputEncoding=_encPrev;
    if(_tmPrev!=null) renderer.toneMapping=_tmPrev;
  }
  postOn=on;
  try{ localStorage.setItem('ak_post', on?'1':'0'); }catch(_e){}
  return postOn;
}

/* ── FRAME. Una funcion por cuadro dentro del loop de Akasha: no hay segundo requestAnimationFrame
   (invariante del gate E2). Se salta entero si la torre no se esta viendo. ── */
var _t=0, EASE=REDUCED?1:0.085;
var posAttr=core.geometry.attributes.position;
function frame(dt){
  _t+=dt;
  if(Math.abs(gapDes-gapCur)>0.01){ gapCur+=(gapDes-gapCur)*EASE; layoutTower(); ubicarTorre(); }
  if(REDUCED) return;
  for(var i=0;i<NP;i++){
    var y=posAttr.array[i*3+1]+0.35+cs[i]*0.3;
    if(y>COREH) y=-8;
    posAttr.array[i*3+1]=y;
  }
  posAttr.needsUpdate=true;
  core.rotation.y=_t*0.25;
  SCREEN_T.jade.offset.y=(_t*0.05)%1;
  SCREEN_T.warn.offset.y=(_t*0.033)%1;
  SCREEN_T.info.offset.y=(_t*0.02)%1;
  floorGroups.forEach(function(fg){ if(fg.userData&&fg.userData.holo) fg.userData.holo.rotation.y=_t*0.5; });
}

/* ── MONTAJE. `ubicarTorre` primero: `layoutTower` lee `tower.position.y` para colocar la luz
   del nucleo, asi que la torre tiene que estar ya en su sitio.
   El haz va al grupo SIN escalar (no a `tower`): sus dos extremos son coordenadas de MUNDO — el
   Nucleo de Akasha en y=10 y el techo de la torre —, y dentro de un grupo escalado por 0.175 y
   corrido 100 unidades hacia abajo no apuntarian a ninguno de los dos. ── */
ubicarTorre(); layoutTower(); ubicarHaz();
extras.add(univBeam);
EXT.addGroup(tower);
EXT.addGroup(extras);
EXT.onFrame(frame);
ediRoot.classList.add('on');
ediRoot.setAttribute('aria-hidden','false');
cargarFlota();
try{ if(localStorage.getItem('ak_post')==='1') ediPost(true); }catch(_e){}

/* Afinador en vivo, mismo contrato que akEncuadre: devuelve los numeros para pegarlos al codigo. */
window.ediEncuadre=function(k, techo){
  if(k!=null) EDI.K=+k;
  if(techo!=null) EDI.TECHO=+techo;
  ALTO_TORRE=8*GAP*EDI.K; Y_PISO_1=EDI.TECHO-ALTO_TORRE;
  ubicarTorre(); ubicarHaz();
  try{console.log('[Edificio encuadre] k='+EDI.K+'  techo='+EDI.TECHO+'  <- pasame estos 2 numeros');}catch(_e){}
  return {k:EDI.K, techo:EDI.TECHO};
};
window.ediPost=ediPost;
window.__EDIFICIO={
  PISOS:PISOS, selectFloor:selectFloor, selectUniverse:selectUniverse,
  /* Abrir una ficha por indice: lo usa el harness y deja la puerta para navegar por teclado sin
     tener que raycastear (el 3D no puede ser el unico camino a un dato). */
  openDash:function(pid, i){ var p=PISOS.filter(function(x){return x.id===pid;})[0];
                             if(p && p.ags[i]) openDash(p, p.ags[i]); },
  refrescar:cargarFlota, post:ediPost,
  _counts:function(){ return {pisos:floorGroups.length, hitsPiso:pickFloors.length,
    hitsAgente:pickAgents.length, agentes:PISOS.reduce(function(n,p){return n+p.ags.length;},0)}; },
  destroy:function(){
    ediPost(false);
    EXT.removeGroup(tower); EXT.removeGroup(extras);
    EXT.offFrame(frame); EXT.removeHits(pickFloors.concat(pickAgents));
    tower.traverse(function(o){ if(o.geometry&&o.geometry.dispose) o.geometry.dispose();
      var ms=Array.isArray(o.material)?o.material:[o.material];
      ms.forEach(function(m){ if(!m) return; if(m.map&&m.map.dispose) m.map.dispose(); if(m.dispose) m.dispose(); }); });
    ediRoot.classList.remove('on'); ediRoot.setAttribute('aria-hidden','true');
    window.__EDIFICIO=null;
  }
};
})();
</script>
