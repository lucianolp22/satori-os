<style>
  :root{--bg:#0b0806;--cream:#F4EEE2;--gold:#DCA75E;--muted:#8b7f6b}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:radial-gradient(1200px 800px at 50% 30%, #171008 0%, var(--bg) 60%);
    color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
    text-align:center;overflow:hidden}
  .stars{position:fixed;inset:0;z-index:0;background-image:
    radial-gradient(1.5px 1.5px at 20% 30%, rgba(244,238,226,.5), transparent),
    radial-gradient(1.5px 1.5px at 75% 20%, rgba(244,238,226,.4), transparent),
    radial-gradient(1px 1px at 60% 70%, rgba(220,167,94,.5), transparent),
    radial-gradient(1px 1px at 35% 80%, rgba(244,238,226,.35), transparent),
    radial-gradient(1.5px 1.5px at 85% 65%, rgba(244,238,226,.4), transparent);}
  .wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:22px}
  .logo{width:min(64vw,300px);height:auto;filter:drop-shadow(0 2px 18px rgba(0,0,0,.5))}
  .sub{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
  .row{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin-top:2px}
  .spin{width:16px;height:16px;border:2px solid rgba(220,167,94,.25);border-top-color:var(--gold);
    border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  .btn{margin-top:10px;display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 26px;
    border-radius:9999px;border:1px solid rgba(220,167,94,.5);background:rgba(220,167,94,.08);
    color:var(--cream);font-size:15px;font-weight:600;cursor:pointer;text-decoration:none}
  .btn:active{transform:translateY(1px)}
  .hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:1;
    font-size:11px;color:#5f574a;padding:0 20px}
</style>
