<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reunión de gestión — DAM Barbers (julio: capturas + propinas + ICO) — Satori</title>
<!--
  ============================================================================
  TABLERO DE REUNIÓN — CHASIS REUTILIZABLE v1.0  ·  Satori / KAIROS
  ----------------------------------------------------------------------------
  Registro A (operativo) · vanilla · sin CDNs · offline · GAS-compatible.
  El MOTOR (CSS + JS de abajo) NO cambia entre reuniones.
  Lo único que se reescribe por reunión es el objeto  SPEC  (bloque marcado).
  Emite un resumen con doble salida: humano legible + JSON SATORI-TABLERO::v1.
  Tokens embebidos abajo en :root — si existe un DESIGN.md canónico, se
  reemplazan esos valores por los del DESIGN.md (mismo nombre de variable).
  ============================================================================
-->
<style>
:root{
  /* — primitivos (privados) — fallback hex; oklch en @supports abajo — */
  --_jade-600:#1f6f5c; --_jade-700:#1a5e4e; --_jade-400:#4f9e88;
  --_n-50:#f4f7f5; --_n-100:#eaefec; --_n-200:#dbe3de; --_n-300:#c4cfc8;
  --_n-500:#6d7a73; --_n-600:#55625b; --_n-800:#2b3a33; --_n-900:#1c2a24;
  --_danger:#b3261e; --_warn:#8a6a1f; --_ok:#1f6f5c;

  /* — semánticos (la API que consumen las pantallas) — */
  --color-bg:var(--_n-50);
  --color-surface:#fbfdfc;
  --color-surface-2:#f0f4f1;
  --color-border:var(--_n-200);
  --color-border-strong:var(--_n-300);
  --color-text:var(--_n-900);
  --color-text-muted:var(--_n-600);
  --color-text-subtle:var(--_n-500);
  --color-primary:var(--_jade-600);
  --color-primary-hover:var(--_jade-700);
  --color-primary-weak:#e3efea;
  --color-on-primary:#ffffff;
  --color-danger:var(--_danger);
  --color-danger-weak:#f9e7e5;
  --color-warn:var(--_warn);
  --color-warn-weak:#f6efdc;
  --color-ok:var(--_ok);
  --color-focus-ring:var(--_jade-600);
  --color-internal:#7a5a1f;
  --color-internal-weak:#f4ecd8;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:24px; --space-6:32px; --space-7:40px; --space-8:48px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-full:9999px;
  --shadow-sm:0 1px 2px rgba(28,42,36,.06);
  --shadow-md:0 2px 10px rgba(28,42,36,.08);
  --shadow-lg:0 10px 30px rgba(28,42,36,.14);

  --text-xs:.75rem; --text-sm:.875rem; --text-base:1rem;
  --text-lg:1.25rem; --text-xl:1.5rem; --text-2xl:1.9rem;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@supports (color:oklch(0 0 0)){
  :root{
    --_jade-600:oklch(.52 .09 168); --_jade-700:oklch(.46 .09 168); --_jade-400:oklch(.66 .08 168);
    --_n-50:oklch(.975 .006 168); --_n-100:oklch(.95 .007 168); --_n-200:oklch(.9 .008 168);
    --_n-300:oklch(.83 .009 168); --_n-500:oklch(.58 .012 168); --_n-600:oklch(.5 .012 168);
    --_n-800:oklch(.32 .012 168); --_n-900:oklch(.24 .012 168);
    --color-surface:oklch(.99 .004 168); --color-surface-2:oklch(.955 .008 168);
    --color-primary-weak:oklch(.93 .03 168);
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--color-bg); color:var(--color-text);
  font-family:var(--font-ui); font-size:var(--text-base); line-height:1.5;
  -webkit-font-smoothing:antialiased; padding-bottom:96px;
}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-num)}

/* — cabecera fija con progreso — */
header{
  position:sticky; top:0; z-index:20; background:var(--color-surface);
  border-bottom:1px solid var(--color-border); box-shadow:var(--shadow-sm);
  padding:var(--space-3) var(--space-4) 0;
}
.head-row{display:flex; gap:var(--space-3); align-items:flex-start; flex-wrap:wrap; max-width:820px; margin:0 auto}
.head-main{flex:1 1 240px; min-width:0}
h1{font-size:var(--text-lg); margin:0; line-height:1.2}
.subtitle{color:var(--color-text-muted); font-size:var(--text-sm); margin-top:2px}
.mode-toggle{flex:0 0 auto}
.progress-wrap{max-width:820px; margin:var(--space-3) auto 0; padding-bottom:var(--space-3)}
.progress-meta{display:flex; justify-content:space-between; font-size:var(--text-xs);
  color:var(--color-text-muted); margin-bottom:var(--space-1)}
.progress-track{height:8px; background:var(--color-surface-2); border-radius:var(--radius-full); overflow:hidden}
.progress-bar{height:100%; width:0; background:var(--color-primary);
  border-radius:var(--radius-full); transition:width .25s ease}

main{max-width:820px; margin:0 auto; padding:var(--space-5) var(--space-4)}

/* — secciones — */
.seccion{background:var(--color-surface); border:1px solid var(--color-border);
  border-radius:var(--radius-lg); margin-bottom:var(--space-4); overflow:hidden}
.sec-head{display:flex; align-items:center; gap:var(--space-3); width:100%;
  padding:var(--space-4); background:none; border:0; cursor:pointer; text-align:left;
  font-family:inherit; font-size:var(--text-base); color:var(--color-text)}
.sec-head:hover{background:var(--color-surface-2)}
.sec-head .chev{transition:transform .2s ease; color:var(--color-text-subtle); flex:0 0 auto}
.seccion.collapsed .chev{transform:rotate(-90deg)}
.sec-title{flex:1 1 auto; font-weight:600}
.sec-desc{font-weight:400; color:var(--color-text-muted); font-size:var(--text-sm); display:block; margin-top:2px}
.sec-count{flex:0 0 auto; font-size:var(--text-xs); color:var(--color-text-subtle);
  background:var(--color-surface-2); padding:2px 8px; border-radius:var(--radius-full)}
.sec-body{padding:0 var(--space-4) var(--space-4)}
.seccion.collapsed .sec-body{display:none}

/* — campos — */
.campo{margin-bottom:var(--space-4)}
.campo:last-child{margin-bottom:0}
.campo label{display:block; font-size:var(--text-sm); font-weight:500;
  color:var(--color-text); margin-bottom:var(--space-2)}
.req{color:var(--color-danger); margin-left:2px}
.hint{font-weight:400; color:var(--color-text-subtle); font-size:var(--text-xs); display:block; margin-top:2px}
.ref-pill{display:inline-block; font-size:var(--text-xs); color:var(--color-text-muted);
  background:var(--color-primary-weak); padding:2px 8px; border-radius:var(--radius-full); margin-left:var(--space-2)}

input,textarea,select{
  width:100%; font-family:inherit; font-size:var(--text-base); color:var(--color-text);
  background:var(--color-surface); border:1px solid var(--color-border-strong);
  border-radius:var(--radius-md); padding:10px 12px; min-height:44px;
}
textarea{min-height:76px; resize:vertical; line-height:1.5}
input:hover,textarea:hover,select:hover{border-color:var(--color-text-subtle)}
input:focus,textarea:focus,select:focus{
  outline:2px solid var(--color-focus-ring); outline-offset:1px; border-color:var(--color-primary)}
input.num-input{font-variant-numeric:tabular-nums; font-family:var(--font-num)}
.campo.invalid input,.campo.invalid textarea,.campo.invalid select{border-color:var(--color-danger)}
.err-msg{color:var(--color-danger); font-size:var(--text-xs); margin-top:var(--space-2); display:none}
.campo.invalid .err-msg{display:block}

/* montos con moneda */
.money-wrap{display:flex; align-items:stretch}
.money-cur{flex:0 0 auto; display:flex; align-items:center; padding:0 12px;
  background:var(--color-surface-2); border:1px solid var(--color-border-strong); border-right:0;
  border-radius:var(--radius-md) 0 0 var(--radius-md); color:var(--color-text-muted); font-size:var(--text-sm)}
.money-wrap input{border-radius:0 var(--radius-md) var(--radius-md) 0}

/* rating alto/medio/bajo (segmented) */
.segmented{display:flex; gap:var(--space-2); flex-wrap:wrap}
.segmented button{flex:1 1 auto; min-width:88px; min-height:44px; cursor:pointer;
  font-family:inherit; font-size:var(--text-sm); color:var(--color-text);
  background:var(--color-surface); border:1px solid var(--color-border-strong);
  border-radius:var(--radius-md); padding:8px}
.segmented button:hover{background:var(--color-surface-2)}
.segmented button[aria-pressed="true"]{
  background:var(--color-primary-weak); border-color:var(--color-primary); color:var(--color-primary-hover); font-weight:600}
.segmented button:focus-visible{outline:2px solid var(--color-focus-ring); outline-offset:1px}

/* bool switch */
.bool-row{display:flex; align-items:center; gap:var(--space-3)}
.bool-row input[type="checkbox"]{width:auto; min-height:auto; transform:scale(1.3); accent-color:var(--color-primary)}

/* repeat / filas repetibles */
.repeat-rows{display:flex; flex-direction:column; gap:var(--space-3)}
.repeat-row{display:flex; gap:var(--space-2); align-items:flex-start; flex-wrap:wrap;
  padding:var(--space-3); background:var(--color-surface-2); border-radius:var(--radius-md)}
.repeat-row .rcell{flex:1 1 140px; min-width:120px}
.repeat-row .rcell label{font-size:var(--text-xs); color:var(--color-text-muted); margin-bottom:var(--space-1)}
.repeat-row .rdel{flex:0 0 auto; min-height:44px; min-width:44px; border:1px solid var(--color-border-strong);
  background:var(--color-surface); border-radius:var(--radius-md); cursor:pointer; color:var(--color-danger); font-size:var(--text-lg)}
.btn-add{margin-top:var(--space-3)}

/* marca de campo/sección INTERNO (no lo ve el cliente) */
.badge-int{display:inline-flex; align-items:center; gap:4px; font-size:var(--text-xs);
  color:var(--color-internal); background:var(--color-internal-weak);
  padding:2px 8px; border-radius:var(--radius-full); margin-left:var(--space-2); font-weight:500}
.campo.interno{border-left:3px solid var(--color-internal); padding-left:var(--space-3); margin-left:-3px}
.seccion.interno .sec-head{background:var(--color-internal-weak)}
body.modo-cliente .interno{display:none !important}

/* botones */
.btn{font-family:inherit; font-size:var(--text-base); font-weight:500; cursor:pointer;
  border-radius:var(--radius-md); padding:12px 18px; min-height:48px; border:1px solid transparent;
  display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2)}
.btn:focus-visible{outline:2px solid var(--color-focus-ring); outline-offset:2px}
.btn-primary{background:var(--color-primary); color:var(--color-on-primary)}
.btn-primary:hover{background:var(--color-primary-hover)}
.btn-secondary{background:var(--color-surface); color:var(--color-text); border-color:var(--color-border-strong)}
.btn-secondary:hover{background:var(--color-surface-2)}
.btn-ghost{background:none; color:var(--color-text-muted); border-color:transparent}
.btn-ghost:hover{background:var(--color-surface-2)}
.btn-sm{min-height:40px; padding:8px 14px; font-size:var(--text-sm)}

/* barra de acciones fija abajo */
.actionbar{position:fixed; bottom:0; left:0; right:0; z-index:20; background:var(--color-surface);
  border-top:1px solid var(--color-border); box-shadow:var(--shadow-lg);
  padding:var(--space-3) var(--space-4); padding-bottom:max(var(--space-3),env(safe-area-inset-bottom))}
.actionbar-inner{max-width:820px; margin:0 auto; display:flex; gap:var(--space-3); align-items:center; flex-wrap:wrap}
.actionbar .grow{flex:1 1 auto}
.autosave{font-size:var(--text-xs); color:var(--color-text-subtle)}

/* modal resumen */
.overlay{position:fixed; inset:0; z-index:40; background:rgba(28,42,36,.5);
  display:none; align-items:flex-end; justify-content:center; padding:0}
.overlay.open{display:flex}
.sheet{background:var(--color-surface); width:100%; max-width:820px; max-height:88vh;
  border-radius:var(--radius-lg) var(--radius-lg) 0 0; display:flex; flex-direction:column}
.sheet-head{display:flex; align-items:center; gap:var(--space-3); padding:var(--space-4);
  border-bottom:1px solid var(--color-border)}
.sheet-head h2{font-size:var(--text-lg); margin:0; flex:1 1 auto}
.sheet-body{padding:var(--space-4); overflow:auto}
.sheet-foot{padding:var(--space-3) var(--space-4); border-top:1px solid var(--color-border);
  display:flex; gap:var(--space-3); flex-wrap:wrap}
.summary-pre{white-space:pre-wrap; word-break:break-word; font-size:var(--text-sm);
  background:var(--color-surface-2); border:1px solid var(--color-border);
  border-radius:var(--radius-md); padding:var(--space-4); max-height:52vh; overflow:auto}
.toast{position:fixed; bottom:104px; left:50%; transform:translateX(-50%); z-index:60;
  background:var(--_n-900); color:#fff; padding:10px 18px; border-radius:var(--radius-full);
  font-size:var(--text-sm); box-shadow:var(--shadow-lg); opacity:0; transition:opacity .2s ease; pointer-events:none}
.toast.show{opacity:1}

@media (min-width:560px){ h1{font-size:var(--text-xl)} }
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>

<header>

</div>

<script>
"use strict";
(function(){
  var SPEC = JSON.parse(document.getElementById("spec").textContent);
  var STORE_KEY = "tablero::" + (SPEC.tablero.tipo || "reunion");
  var state = {};        // fieldId -> value | array de filas
  var actaId = "";
  var modoCliente = false;
  var saveTimer = null;

  // ---- utilidades ----
  function $(id){ return document.getElementById(id); }
  function slug(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
      .replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,28) || "cliente"; }
  function todayYMD(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function rand4(){ return Math.random().toString(36).slice(2,6); }
  function ymdToDMY(v){ if(!v) return ""; var p=String(v).split("-"); return p.length===3 ? p[2]+"/"+p[1]+"/"+p[0] : v; }
  function esc(s){ return String(s==null?"":s); }
  function allFields(){ var out=[]; SPEC.secciones.forEach(function(sec){ sec.campos.forEach(function(f){ out.push({sec:sec,f:f}); }); }); return out; }

  function newActaId(){
    var cli = slug(state.cliente_nombre);
    return cli + "-" + (SPEC.tablero.tipo||"reunion") + "-" + todayYMD().replace(/-/g,"") + "-" + rand4();
  }

  // ---- persistencia ----
  function save(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({ actaId: actaId, state: state, ts: Date.now() }));
      var el=$("autosave"); if(el){ el.textContent="Guardado ✓ · solo en este dispositivo"; }
    }catch(e){ var el2=$("autosave"); if(el2){ el2.textContent="⚠ No se pudo guardar localmente"; } }
  }
  function scheduleSave(){ if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(save,400); }
  function load(){
    try{
      var raw=localStorage.getItem(STORE_KEY); if(!raw) return false;
      var obj=JSON.parse(raw); state=obj.state||{}; actaId=obj.actaId||""; return true;
    }catch(e){ return false; }
  }

  // ---- render ----
  function fieldValue(f){ return state[f.id]; }

  function renderField(sec, f){
    var wrap=document.createElement("div");
    wrap.className="campo"+(f.interno?" interno":"");
    wrap.setAttribute("data-field", f.id);

    if(f.tipo!=="bool"){
      var lab=document.createElement("label");
      lab.setAttribute("for","fld-"+f.id);
      lab.innerHTML = esc(f.label) + (f.required?'<span class="req" title="requerido">*</span>':"");
      if(f.interno){ var b=document.createElement("span"); b.className="badge-int"; b.textContent="🔒 interno"; lab.appendChild(b); }
      if(f.referencia){ var r=document.createElement("span"); r.className="ref-pill"; r.textContent="ref: "+f.referencia; lab.appendChild(r); }
      if(f.ayuda){ var h=document.createElement("span"); h.className="hint"; h.textContent=f.ayuda; lab.appendChild(h); }
      wrap.appendChild(lab);
    }

    var control = buildControl(f);
    wrap.appendChild(control);

    var err=document.createElement("div"); err.className="err-msg"; err.textContent="Este campo es necesario"; wrap.appendChild(err);
    return wrap;
  }

  function buildControl(f){
    var v = fieldValue(f);
    if(f.tipo==="longtext"){
      var ta=document.createElement("textarea"); ta.id="fld-"+f.id; if(v!=null) ta.value=v;
      ta.addEventListener("input",function(){ state[f.id]=ta.value; onChange(f); });
      return ta;
    }
    if(f.tipo==="number"){
      var ni=document.createElement("input"); ni.type="number"; ni.inputMode="decimal"; ni.className="num-input";
      ni.id="fld-"+f.id; if(v!=null) ni.value=v;
      ni.addEventListener("input",function(){ state[f.id]=ni.value; onChange(f); });
      return ni;
    }
    if(f.tipo==="money"){
      var mw=document.createElement("div"); mw.className="money-wrap";
      var cur=document.createElement("span"); cur.className="money-cur"; cur.textContent=(SPEC.moneda_base==="EUR")?"€":(SPEC.moneda_base||"€");
      var mi=document.createElement("input"); mi.type="number"; mi.inputMode="decimal"; mi.className="num-input";
      mi.id="fld-"+f.id; if(v!=null) mi.value=v; mi.placeholder="0,00";
      mi.addEventListener("input",function(){ state[f.id]=mi.value; onChange(f); });
      mw.appendChild(cur); mw.appendChild(mi); return mw;
    }
    if(f.tipo==="date"){
      var di=document.createElement("input"); di.type="date"; di.id="fld-"+f.id; if(v!=null) di.value=v;
      di.addEventListener("input",function(){ state[f.id]=di.value; onChange(f); });
      return di;
    }
    if(f.tipo==="select"){
      var se=document.createElement("select"); se.id="fld-"+f.id;
      var o0=document.createElement("option"); o0.value=""; o0.textContent="— elegir —"; se.appendChild(o0);
      (f.opciones||[]).forEach(function(op){ var o=document.createElement("option"); o.value=op; o.textContent=op; if(v===op)o.selected=true; se.appendChild(o); });
      se.addEventListener("change",function(){ state[f.id]=se.value; onChange(f); });
      return se;
    }
    if(f.tipo==="bool"){
      var row=document.createElement("div"); row.className="bool-row";
      var cb=document.createElement("input"); cb.type="checkbox"; cb.id="fld-"+f.id; cb.checked=!!v;
      var cl=document.createElement("label"); cl.setAttribute("for","fld-"+f.id); cl.style.marginBottom="0";
      cl.innerHTML=esc(f.label)+(f.interno?'<span class="badge-int">🔒 interno</span>':"");
      cb.addEventListener("change",function(){ state[f.id]=cb.checked; onChange(f); });
      row.appendChild(cb); row.appendChild(cl); return row;
    }
    if(f.tipo==="rating"){
      var seg=document.createElement("div"); seg.className="segmented"; seg.setAttribute("role","group");
      (f.opciones||[]).forEach(function(op){
        var bt=document.createElement("button"); bt.type="button"; bt.textContent=op;
        bt.setAttribute("aria-pressed", v===op?"true":"false");
        bt.addEventListener("click",function(){
          state[f.id]=(state[f.id]===op)?"":op;
          Array.prototype.forEach.call(seg.children,function(c){ c.setAttribute("aria-pressed", c.textContent===state[f.id]?"true":"false"); });
          onChange(f);
        });
        seg.appendChild(bt);
      });
      return seg;
    }
    if(f.tipo==="repeat"){
      var box=document.createElement("div");
      var rows=document.createElement("div"); rows.className="repeat-rows"; rows.id="rows-"+f.id;
      if(!Array.isArray(state[f.id])) state[f.id]=[];
      state[f.id].forEach(function(_,i){ rows.appendChild(buildRepeatRow(f,i)); });
      var add=document.createElement("button"); add.type="button"; add.className="btn btn-secondary btn-sm btn-add";
      add.textContent="+ Agregar";
      add.addEventListener("click",function(){ state[f.id].push({}); rows.appendChild(buildRepeatRow(f,state[f.id].length-1)); onChange(f); });
      box.appendChild(rows); box.appendChild(add); return box;
    }
    // text por defecto
    var ti=document.createElement("input"); ti.type="text"; ti.id="fld-"+f.id; if(v!=null) ti.value=v;
    ti.addEventListener("input",function(){ state[f.id]=ti.value; onChange(f); });
    return ti;
  }

  function buildRepeatRow(f,i){
    var row=document.createElement("div"); row.className="repeat-row"; row.setAttribute("data-i",i);
    (f.columnas||[]).forEach(function(col){
      var cell=document.createElement("div"); cell.className="rcell";
      var lab=document.createElement("label"); lab.textContent=col.label; cell.appendChild(lab);
      var inp=document.createElement("input"); inp.type=(col.tipo==="date")?"date":(col.tipo==="number"?"number":"text");
      var cur=(state[f.id][i]||{})[col.id]; if(cur!=null) inp.value=cur;
      inp.addEventListener("input",function(){ if(!state[f.id][i])state[f.id][i]={}; state[f.id][i][col.id]=inp.value; onChange(f); });
      cell.appendChild(inp); row.appendChild(cell);
    });
    var del=document.createElement("button"); del.type="button"; del.className="rdel"; del.setAttribute("aria-label","Quitar fila"); del.textContent="×";
    del.addEventListener("click",function(){ state[f.id].splice(i,1); rerenderRepeat(f); onChange(f); });
    row.appendChild(del); return row;
  }
  function rerenderRepeat(f){
    var rows=$("rows-"+f.id); if(!rows) return; rows.innerHTML="";
    state[f.id].forEach(function(_,i){ rows.appendChild(buildRepeatRow(f,i)); });
  }

  function renderSection(sec){
    var box=document.createElement("section"); box.className="seccion"+(sec.modo==="interno"?" interno":"");
    box.setAttribute("data-sec",sec.id);
    var head=document.createElement("button"); head.type="button"; head.className="sec-head";
    head.innerHTML='<span class="chev">▾</span>';
    var titWrap=document.createElement("span"); titWrap.className="sec-title";
    titWrap.innerHTML=esc(sec.titulo)+(sec.modo==="interno"?'<span class="badge-int">🔒 no se muestra al cliente</span>':"")
      +(sec.desc?'<span class="sec-desc">'+esc(sec.desc)+'</span>':"");
    head.appendChild(titWrap);
    var cnt=document.createElement("span"); cnt.className="sec-count"; cnt.id="cnt-"+sec.id; head.appendChild(cnt);
    head.addEventListener("click",function(){ box.classList.toggle("collapsed"); });
    box.appendChild(head);
    var body=document.createElement("div"); body.className="sec-body";
    sec.campos.forEach(function(f){ body.appendChild(renderField(sec,f)); });
    box.appendChild(body);
    return box;
  }

  function render(){
    $("t-title").textContent = "Tablero — " + (SPEC.tablero.titulo || "Reunión");
    var root=$("form-root"); root.innerHTML="";
    SPEC.secciones.forEach(function(sec){ root.appendChild(renderSection(sec)); });
    updateSubtitle(); updateProgress();
  }

  function updateSubtitle(){
    var parts=[];
    if(state.cliente_nombre) parts.push(state.cliente_nombre);
    if(state.fecha) parts.push(ymdToDMY(state.fecha));
    parts.push("Fase "+(SPEC.tablero.fase_kairos||"?")+" · "+(SPEC.tablero.tipo||""));
    $("t-subtitle").textContent = parts.join("  ·  ");
  }

  // ---- validación + progreso ----
  function isFilled(f){
    var v=state[f.id];
    if(f.tipo==="repeat") return Array.isArray(v) && v.some(function(r){ return r && Object.keys(r).some(function(k){ return String(r[k]||"").trim()!==""; }); });
    if(f.tipo==="bool") return v===true;
    return v!=null && String(v).trim()!=="";
  }
  function validateField(f){
    if(!f.required) return true;
    var ok=isFilled(f);
    var el=document.querySelector('[data-field="'+f.id+'"]');
    if(el){ el.classList.toggle("invalid", !ok); }
    return ok;
  }
  function updateProgress(){
    var fields=allFields().map(function(x){return x.f;});
    var reqs=fields.filter(function(f){return f.required;});
    var pool = reqs.length? reqs : fields;
    var done = pool.filter(isFilled).length;
    var pct = pool.length? Math.round(done/pool.length*100) : 0;
    $("prog-bar").style.width=pct+"%";
    $("prog-label").textContent = done+" de "+pool.length+(reqs.length?" campos clave":" campos");
    $("prog-pct").textContent=pct+"%";
    // conteo por sección
    SPEC.secciones.forEach(function(sec){
      var el=$("cnt-"+sec.id); if(!el) return;
      var d=sec.campos.filter(isFilled).length; el.textContent=d+"/"+sec.campos.length;
    });
  }

  function onChange(f){
    if(f.id==="cliente_nombre" || f.id==="fecha") updateSubtitle();
    if(f.required) validateField(f);
    if(!actaId && state.cliente_nombre){ actaId=newActaId(); }
    updateProgress(); scheduleSave();
  }

  // ---- resumen: humano + JSON v1 ----
  function fmtVal(f){
    var v=state[f.id];
    if(f.tipo==="date") return ymdToDMY(v);
    if(f.tipo==="money") return v!=null&&v!==""?(v+" "+(SPEC.moneda_base||"")):"";
    if(f.tipo==="repeat"){
      if(!Array.isArray(v)||!v.length) return "";
      return v.map(function(r){ return (f.columnas||[]).map(function(c){ return (r[c.id]||"—"); }).join(" · "); }).join("\n      ");
    }
    return v==null?"":String(v);
  }

  function buildSummary(){
    if(!actaId) actaId=newActaId();
    var lines=[];
    var human=[];
    human.push("TABLERO DE REUNIÓN — "+(SPEC.tablero.titulo||""));
    human.push("Acta: "+actaId);
    var faltan=[];
    var datos={};

    SPEC.secciones.forEach(function(sec){
      var secLines=[];
      sec.campos.forEach(function(f){
        var filled=isFilled(f);
        if(f.required && !filled) faltan.push(f.label);
        // registro para JSON
        var raw = state[f.id];
        if(filled){
          datos[f.id]={
            label:f.label, tipo:f.tipo, destino:f.destino||null, interno:!!f.interno,
            valor: (f.tipo==="repeat")? raw : (f.tipo==="bool"? !!raw : raw)
          };
        }
        var shown=fmtVal(f);
        if(shown!=="") secLines.push("   • "+(f.interno?"[interno] ":"")+f.label+": "+shown);
      });
      if(secLines.length){ human.push(""); human.push("── "+sec.titulo+" ──"); human.push(secLines.join("\n")); }
    });

    var completitud = (function(){
      var fields=allFields().map(function(x){return x.f;});
      var reqs=fields.filter(function(f){return f.required;});
      var pool=reqs.length?reqs:fields; var done=pool.filter(isFilled).length;
      return pool.length? Math.round(done/pool.length*100)/100 : 0;
    })();

    var payload={
      schema:"SATORI-TABLERO::v1",
      app_version:SPEC.app_version||"1.0",
      acta_id:actaId,
      cliente:{ nombre: state.cliente_nombre||"", responsable: state.responsable||"" },
      reunion:{ tipo:SPEC.tablero.tipo||null, fase_kairos:SPEC.tablero.fase_kairos||null, servicio:SPEC.tablero.servicio||null, fecha:ymdToDMY(state.fecha) },
      generado_el:new Date().toISOString(),
      moneda_base:SPEC.moneda_base||"EUR",
      datos:datos,
      meta:{ completitud:completitud, campos_faltantes:faltan }
    };

    var out = human.join("\n");
    out += "\n\n";
    if(faltan.length){ out += "⚠ Faltan campos clave: "+faltan.join(", ")+"\n\n"; }
    out += "———— BLOQUE DE DATOS (no editar — lo levanto al Sistema) ————\n";
    out += "```json\n"+JSON.stringify(payload,null,2)+"\n```";
    return { text: out, payload: payload };
  }

  // ---- clipboard con fallback (funciona en file://) ----
  function copyText(txt, okMsg){
    function fallback(){
      var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      try{ document.execCommand("copy"); toast(okMsg||"Copiado ✓"); }catch(e){ toast("Copiá manualmente (Ctrl/Cmd+C)"); }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast(okMsg||"Copiado ✓"); }, fallback);
    } else { fallback(); }
  }
  function downloadJSON(payload){
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob); var a=document.createElement("a");
    a.href=url; a.download=(payload.acta_id||"tablero")+".json"; document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url); toast("Descargado ✓");
  }
  function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(function(){ t.classList.remove("show"); },1800); }

  // ---- eventos UI ----
  var lastSummary=null;
  function openSummary(){
    // validar requeridos
    var okAll=true; allFields().forEach(function(x){ if(x.f.required && !validateField(x.f)) okAll=false; });
    lastSummary=buildSummary();
    $("summary-out").textContent=lastSummary.text;
    $("overlay").classList.add("open");
    if(!okAll) toast("Ojo: faltan campos clave");
  }
  function closeSummary(){ $("overlay").classList.remove("open"); }

  function setMode(cliente){
    modoCliente=cliente; document.body.classList.toggle("modo-cliente",cliente);
    var b=$("btn-mode"); b.setAttribute("aria-pressed",cliente?"true":"false");
    b.textContent = cliente ? "🔓 Ver todo" : "👁 Modo cliente";
  }

  function wire(){
    $("btn-mode").addEventListener("click",function(){ setMode(!modoCliente); });
    $("btn-summary").addEventListener("click",openSummary);
    $("btn-close").addEventListener("click",closeSummary);
    $("overlay").addEventListener("click",function(e){ if(e.target===$("overlay")) closeSummary(); });
    $("btn-copy").addEventListener("click",function(){ if(lastSummary) copyText(lastSummary.text,"Resumen copiado ✓"); });
    $("btn-download").addEventListener("click",function(){ var s=buildSummary(); downloadJSON(s.payload); });
    $("btn-download2").addEventListener("click",function(){ if(lastSummary) downloadJSON(lastSummary.payload); });
    $("btn-reset").addEventListener("click",function(){
      if(confirm("¿Borrar todo lo cargado en este tablero? No se puede deshacer.")){
        try{ localStorage.removeItem(STORE_KEY); }catch(e){}
        state={}; actaId=""; render(); toast("Tablero reiniciado");
      }
    });
    document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeSummary(); });
  }

  // ---- init ----
  load();
  render();
  wire();
})();
</script>
</body>
</html>
