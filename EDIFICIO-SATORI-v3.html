<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏢 Edificio Satori — v2 · torre cinematográfica (propuesta)</title>
<style>
:root{
  --bg:#101009; --surface:#1C1C17; --surface-2:#24241E; --surface-3:#2C2C25;
  --border:#33332B; --border-strong:#474740;
  --text:#ECEAE3; --muted:#ADAB9F; --subtle:#7C7A70;
  --jade:#4FB89C; --jade-hover:#5FC9AC; --jade-weak:#16352C;
  --gold:#D4A857; --info:#5FA8C9; --danger:#DD6B5C; --warning:#D79A3D; --success:#5FB97A;
  --focus:#4FB89C;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --r-sm:4px;--r-md:8px;--r-lg:12px;--r-full:9999px;
  --tx-xs:.75rem;--tx-sm:.875rem;--tx-base:1rem;--tx-lg:1.25rem;--tx-xl:1.5625rem;
  --ease:cubic-bezier(.22,.8,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:var(--tx-base);line-height:1.5;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;display:block;cursor:grab}
#gl.drag{cursor:grabbing}
#gl.pick{cursor:pointer}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 42%,transparent 52%,rgba(6,6,3,.55) 100%)}

/* ── HUD ── */
.hud-top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:var(--s4);
  padding:var(--s3) var(--s5);background:linear-gradient(180deg,rgba(12,12,8,.9),rgba(12,12,8,0));z-index:10;pointer-events:none}
.hud-top>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:var(--tx-lg);margin:0;font-weight:600;letter-spacing:-.01em}
.brand .v{font-size:var(--tx-xs);color:var(--warning);border:1px dashed var(--warning);border-radius:var(--r-full);padding:1px 9px}
.hint{margin-left:auto;font-size:var(--tx-xs);color:var(--subtle)}
.hint b{color:var(--muted);font-weight:600}
.osbar{display:flex;align-items:center;gap:12px;pointer-events:auto;flex-wrap:wrap}
.iso{color:var(--jade);font-size:18px;filter:drop-shadow(0 0 6px rgba(79,184,156,.6))}
.crumbs{font-size:var(--tx-sm);color:var(--muted);display:flex;align-items:center;gap:7px}
.crumbs b{color:var(--text);letter-spacing:.05em}
.crumbs .sep{color:var(--subtle)}
.crumbs .here{color:var(--jade);font-weight:600}
.modesw{display:flex;background:rgba(24,24,19,.82);border:1px solid var(--border-strong);border-radius:var(--r-full);padding:2px;backdrop-filter:blur(8px)}
.modesw .m{background:none;border:0;color:var(--muted);font:inherit;font-size:var(--tx-xs);padding:5px 12px;border-radius:var(--r-full);cursor:pointer;min-height:28px}
.modesw .m.sel{background:var(--jade-weak);color:var(--jade-hover);font-weight:600}
.modesw .m:not(.sel):hover{color:var(--text)}
.osbadge{font-size:var(--tx-xs);color:var(--warning);border:1px dashed var(--warning);border-radius:var(--r-full);padding:1px 8px}
.prov{position:fixed;left:var(--s4);bottom:var(--s4);font-size:var(--tx-xs);color:var(--subtle);background:rgba(24,24,19,.7);border:1px solid var(--border);border-radius:var(--r-full);padding:5px 12px;backdrop-filter:blur(6px);pointer-events:auto;z-index:10}
.prov b{color:var(--muted)} .prov .d{color:var(--success)}
.toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-8px);background:rgba(24,24,19,.96);border:1px solid var(--border-strong);border-radius:var(--r-md);padding:9px 15px;font-size:var(--tx-sm);color:var(--text);z-index:25;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:560px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:880px){.crumbs .sep,.crumbs b{display:none}.prov{display:none}}

.dir{position:fixed;left:var(--s4);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;z-index:10}
.dir button{display:flex;align-items:center;gap:8px;background:rgba(24,24,19,.82);border:1px solid var(--border-strong);
  backdrop-filter:blur(8px);color:var(--text);border-radius:var(--r-md);padding:6px 10px;font:inherit;font-size:var(--tx-xs);
  cursor:pointer;min-height:30px;min-width:172px;text-align:left;transition:border-color .15s var(--ease),transform .15s var(--ease)}
.dir button .n{color:var(--dc,var(--jade));font-weight:600;font-variant-numeric:tabular-nums;min-width:22px}
.dir button .c{margin-left:auto;color:var(--subtle);font-variant-numeric:tabular-nums}
.dir button:hover{border-color:var(--dc,var(--jade));transform:translateX(2px)}
.dir button[aria-pressed="true"]{border-color:var(--dc,var(--jade));background:var(--surface-2);box-shadow:inset 2px 0 0 var(--dc,var(--jade))}
.dir button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

.viewbar{position:fixed;left:50%;bottom:var(--s4);transform:translateX(-50%);display:flex;gap:var(--s2);z-index:10}
.viewbar button{background:rgba(24,24,19,.82);backdrop-filter:blur(8px);border:1px solid var(--border-strong);color:var(--text);
  border-radius:var(--r-full);padding:8px 16px;font:inherit;font-size:var(--tx-sm);cursor:pointer;min-height:36px;transition:border-color .15s}
.viewbar button:hover{border-color:var(--jade)}
.viewbar button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

.tip{position:fixed;z-index:20;background:rgba(24,24,19,.95);border:1px solid var(--border-strong);border-radius:var(--r-md);
  padding:5px 10px;font-size:var(--tx-xs);pointer-events:none;display:none;max-width:240px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.tip b{color:var(--tc,var(--jade))}
.tip span{color:var(--subtle)}

/* ── Panel de piso ── */
.panel{position:fixed;right:var(--s4);top:64px;bottom:var(--s4);width:min(400px,92vw);z-index:12;
  background:rgba(24,24,19,.92);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:var(--s4) var(--s5);overflow:auto;transform:translateX(calc(100% + 24px));transition:transform .35s var(--ease)}
.panel.open{transform:translateX(0)}
.p-head{display:flex;align-items:baseline;gap:var(--s3);border-bottom:1px solid var(--border);padding-bottom:var(--s3);margin-bottom:var(--s3)}
.p-title{font-size:var(--tx-lg);font-weight:600}
.p-tag{font-size:var(--tx-xs);color:var(--fc,var(--jade));border:1px solid var(--fc,var(--jade));border-radius:var(--r-full);padding:1px 8px}
.p-close{margin-left:auto;background:none;border:1px solid var(--border-strong);color:var(--muted);border-radius:var(--r-md);
  padding:2px 10px;cursor:pointer;font-size:var(--tx-sm);min-height:28px}
.p-close:hover{border-color:var(--jade);color:var(--text)}
.p-desc{color:var(--muted);font-size:var(--tx-sm);margin-bottom:var(--s3)}
.conn{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--s3)}
.conn span{font-size:var(--tx-xs);background:var(--jade-weak);color:var(--jade-hover);border-radius:var(--r-sm);padding:2px 8px;font-weight:500}
.agents{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.agent{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);
  padding:var(--s2) var(--s3);cursor:pointer;text-align:left;color:var(--text);font:inherit;min-height:48px;
  transition:border-color .15s,transform .15s var(--ease)}
.agent:hover{border-color:var(--fc,var(--jade));transform:translateY(-1px)}
.agent:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.agent .nm{font-size:var(--tx-sm);font-weight:600;display:flex;gap:6px;align-items:center}
.agent .rl{font-size:var(--tx-xs);color:var(--subtle)}
.agent .st{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.st.g{background:var(--success);animation:pulse 2.4s infinite}
.st.b{background:var(--info)} .st.y{background:var(--warning)} .st.gr{background:var(--subtle)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(95,185,122,.5)}50%{box-shadow:0 0 0 5px rgba(95,185,122,0)}}
.legend{margin-top:var(--s3);font-size:var(--tx-xs);color:var(--subtle);line-height:1.7}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}

/* ── Dashboard de agente ── */
.scrim{position:fixed;inset:0;background:rgba(8,8,5,.76);backdrop-filter:blur(4px);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.open{opacity:1;pointer-events:auto}
.dash{position:fixed;top:50%;left:50%;width:min(860px,95vw);max-height:90vh;overflow:auto;z-index:31;
  background:linear-gradient(180deg,#1E1E18,#191914);border:1px solid var(--border-strong);border-radius:14px;padding:var(--s5) var(--s6);
  transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .35s var(--ease),opacity .3s;
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(79,184,156,.06)}
.dash.open{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.d-head{display:flex;align-items:center;gap:var(--s3);padding-right:52px;flex-wrap:wrap;margin-bottom:2px}
.d-ava{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--fc,var(--jade)),transparent 160%);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#10100c}
.d-title{font-size:var(--tx-xl);font-weight:650;letter-spacing:-.01em}
.d-area{font-size:var(--tx-xs);color:var(--fc,var(--jade));border:1px solid var(--fc,var(--jade));border-radius:var(--r-full);padding:1px 9px}
.d-live{margin-left:auto;font-size:var(--tx-xs);display:flex;gap:6px;align-items:center;font-weight:600;letter-spacing:.05em}
.d-live i{width:8px;height:8px;border-radius:50%;background:var(--lv,var(--success));box-shadow:0 0 8px var(--lv,var(--success))}
.d-mis{color:var(--muted);font-size:var(--tx-sm);margin:var(--s2) 0 var(--s4);max-width:70ch}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3);margin-bottom:var(--s4)}
.kpi{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s3);position:relative;overflow:hidden}
.kpi .lb{font-size:var(--tx-xs);color:var(--subtle);text-transform:uppercase;letter-spacing:.07em}
.kpi b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums;margin:2px 0}
.kpi .dl{font-size:var(--tx-xs);font-weight:600}
.kpi .dl.up{color:var(--success)} .kpi .dl.dn{color:var(--danger)} .kpi .dl.fl{color:var(--subtle)}
.kpi svg{position:absolute;right:6px;bottom:6px;opacity:.8}
.d-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:var(--s4);margin-bottom:var(--s4)}
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s3) var(--s4)}
.card h4{margin:0 0 var(--s2);font-size:var(--tx-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--subtle);font-weight:600;display:flex}
.card h4 span{margin-left:auto;color:var(--fc,var(--jade));cursor:default}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:var(--s2);font-size:var(--tx-sm);padding:7px 0;border-bottom:1px solid var(--border);align-items:baseline}
.feed li:last-child{border-bottom:0}
.feed .ic{flex:0 0 auto;color:var(--fc,var(--jade))}
.feed .t{margin-left:auto;color:var(--subtle);font-size:var(--tx-xs);white-space:nowrap;font-variant-numeric:tabular-nums}
.donut-wrap{display:flex;gap:var(--s4);align-items:center}
.dleg{font-size:var(--tx-xs);color:var(--muted);line-height:1.9;flex:1}
.dleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.dleg .pc{float:right;color:var(--text);font-variant-numeric:tabular-nums}
.tools{display:flex;flex-wrap:wrap;gap:5px}
.tools span{font-size:var(--tx-xs);background:var(--jade-weak);color:var(--jade-hover);border-radius:var(--r-sm);padding:2px 8px;font-weight:500}
.cel{font-size:var(--tx-sm);color:var(--muted);line-height:1.6}
.cel b{color:var(--text)}
.flow{display:flex;align-items:center;justify-content:center;gap:var(--s4);margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--border)}
.fstep{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:var(--tx-xs);letter-spacing:.08em;color:var(--muted)}
.fstep i{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--fc,var(--jade));display:flex;align-items:center;justify-content:center;font-size:18px;font-style:normal}
.farrow{color:var(--fc,var(--jade));font-size:18px;margin-bottom:18px}
.d-close{position:absolute;top:14px;right:14px;background:var(--surface-2);border:1px solid var(--border-strong);
  color:var(--text);border-radius:var(--r-md);padding:6px 12px;cursor:pointer;font-size:var(--tx-sm);min-width:44px;min-height:32px}
.d-close:hover{border-color:var(--jade)}
.d-demo{font-size:var(--tx-xs);color:var(--warning);border-top:1px dashed var(--warning);margin-top:var(--s4);padding-top:var(--s2)}
@media (max-width:880px){.kpis{grid-template-columns:1fr 1fr}.d-grid{grid-template-columns:1fr}.dir{display:none}.hint{display:none}}
@media (prefers-reduced-motion:reduce){
  .panel,.dash,.scrim,.dir button,.agent{transition:none}
  .st.g{animation:none}
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vignette"></div>

<header class="hud-top">
  <div class="osbar">
    <span class="iso">✳</span>
    <div class="crumbs"><b>SATORI OS</b><span class="sep">›</span>Akasha<span class="sep">›</span><span class="here">🏢 Edificio</span></div>
    <div class="modesw">
      <button class="m" id="mUni" title="La sala hermana de Akasha: el orbe de clientes + el Cerebro">◎ Oficina Universo</button>
      <button class="m sel" id="mEdif" aria-selected="true">🏢 Edificio</button>
    </div>
    <span class="osbadge">v3 · maqueta</span>
  </div>
  <div class="hint"><b>arrastrá</b> girar · <b>rueda/pinch</b> zoom · <b>shift+arrastrar</b> desplazar · <b>click</b> piso o agente · <b>doble click</b> general</div>
</header>
<div class="prov"><span class="d">●</span> estados de agentes en vivo · <b>bootUniverso</b> · misma escena que Akasha</div>
<div class="toast" id="toast"></div>

<nav class="dir" id="dir" aria-label="Directorio de pisos"></nav>

<div class="viewbar">
  <button id="btnExplode">⇕ Expandir torre</button>
  <button id="btnReset">◎ Vista inicial</button>
</div>

<div class="tip" id="tip"></div>
<aside class="panel" id="panel" aria-label="Planta seleccionada"></aside>
<div class="scrim" id="scrim"></div>
<div class="dash" id="dash" role="dialog" aria-modal="true"></div>

function tex(fn,w=256,h=256,rep=1){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  fn(cv.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(cv);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);
  t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  return t;
}
function carpetTex(base,accent){
  return tex((g,w,h)=>{
    g.fillStyle=base;g.fillRect(0,0,w,h);
    for(let i=0;i<2600;i++){
      g.fillStyle=Math.random()<.5?'rgba(255,255,255,.022)':'rgba(0,0,0,.05)';
      g.fillRect(Math.random()*w,Math.random()*h,1.6,1.6);
    }
    g.strokeStyle='rgba(255,255,255,.045)';g.lineWidth=1;
    for(let x=0;x<=w;x+=64){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}
    for(let y=0;y<=h;y+=64){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
    g.strokeStyle=accent;g.globalAlpha=.16;g.lineWidth=2;
    g.strokeRect(8,8,w-16,h-16);g.globalAlpha=1;
  },256,256,3);
}
function screenTexFactory(accCss){
  return tex((g,w,h)=>{
    g.fillStyle='#0d1512';g.fillRect(0,0,w,h);
    g.fillStyle=accCss;g.globalAlpha=.9;g.fillRect(0,0,w,7);g.globalAlpha=1;
    /* líneas de log */
    for(let i=0;i<9;i++){
      const y=20+i*13;
      g.fillStyle=i%3===0?accCss:'rgba(236,234,227,.5)';
      g.globalAlpha=i%3===0?.85:.45;
      g.fillRect(10,y,30+((i*53)%68),4);g.globalAlpha=1;
    }
    /* sparkline */
    g.strokeStyle=accCss;g.lineWidth=2.4;g.beginPath();
    for(let x=0;x<=100;x+=10){
      const y=176-((Math.sin(x*.38)+1)*16+((x*13)%17));
      x===0?g.moveTo(14+x,y):g.lineTo(14+x,y);
    }
    g.stroke();
    /* barras */
    for(let i=0;i<6;i++){g.fillStyle=accCss;g.globalAlpha=.5+.5*((i*7)%10)/10;
      g.fillRect(150+i*15,190-((i*37)%52)-14,9,((i*37)%52)+14);}
    g.globalAlpha=1;
  },256,224,1);
}

let dragging=false,panning=false,px=0,py=0,downX=0,downY=0,moved=false,lastAct=0;
function bump(){lastAct=performance.now();}
canvas.addEventListener('pointerdown',e=>{
  bump();dragging=true;panning=e.shiftKey||e.button===2;
  px=downX=e.clientX;py=downY=e.clientY;moved=false;
  canvas.classList.add('drag');canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(dragging){
    bump();
    const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
    if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)>6)moved=true;
    if(panning){
      const s=st.r/900;
      const right=new THREE.Vector3().subVectors(camera.position,st.tgt).cross(camera.up).normalize();
      des.tgt.addScaledVector(right,dx*s);
      des.tgt.y+=dy*s;
      des.tgt.y=Math.max(0,Math.min(des.tgt.y,8*gapDes+70));
    }else{
      des.theta-=dx*.0052;
      des.phi=Math.max(.24,Math.min(1.44,des.phi-dy*.004));
    }

});
canvas.addEventListener('pointerup',e=>{

});

},{passive:false});

canvas.addEventListener('touchstart',e=>{bump();if(e.touches.length===2){pinchD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}},{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);

/* picking */
const ray=new THREE.Raycaster(),m2=new THREE.Vector2();
function castAt(x,y,list){
  m2.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);
  ray.setFromCamera(m2,camera);
  const hits=ray.intersectObjects(list,false);
  return hits.find(h=>{let o=h.object;while(o){if(o.visible===false)return false;o=o.parent}return true})||null;
}
const tip=document.getElementById('tip');
let hovered=null;
function hoverCheck(e){
  const hitA=castAt(e.clientX,e.clientY,pickAgents);
  if(hitA){
    canvas.classList.add('pick');
    const p=PISOS.find(x=>x.id===hitA.object.userData.pid),a=p.ags[hitA.object.userData.idx];
    tip.style.display='block';
    tip.style.setProperty('--tc',CSSC[p.c]);
    tip.style.left=Math.min(e.clientX+14,innerWidth-230)+'px';
    tip.style.top=(e.clientY+14)+'px';
    tip.innerHTML='<b>'+esc(a.n)+'</b><br><span>'+esc(a.r)+' · '+ST_LABEL[a.st]+'</span>';
    setGlow(a,true);
    if(hovered&&hovered!==a)setGlow(hovered,false);
    hovered=a;return;
  }
  if(hovered){setGlow(hovered,false);hovered=null;}
  tip.style.display='none';
  canvas.classList.toggle('pick',!!castAt(e.clientX,e.clientY,pickFloors));
}
function setGlow(a,on){
  if(!a._unit)return;
  const u=a._unit.userData;
  if(u.halo)u.halo.scale.setScalar(on?1.9:1);
  if(u.hglow)u.hglow.material.opacity=on?1:.85;
}
function clickAt(x,y){
  const hitA=castAt(x,y,pickAgents);
  if(hitA){const{pid,idx}=hitA.object.userData;selectFloor(pid,false);openDash(PISOS.find(p=>p.id===pid),PISOS.find(p=>p.id===pid).ags[idx]);return;}
  const hitF=castAt(x,y,pickFloors);
  if(hitF)selectFloor(hitF.object.userData.pid);
}

/* mini-gráficos SVG (demo determinística) */
function seedArr(name,n,base,amp){
  let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))>>>0;
  const out=[];for(let i=0;i<n;i++){h=(h*1103515245+12345)>>>0;out.push(base+((h>>16)%1000)/1000*amp);}
  return out;
}
function spark(name,color,w=72,h=26){
  const d=seedArr(name,14,.25,.7);
  const pts=d.map((v,i)=>`${(i/(d.length-1)*w).toFixed(1)},${(h-v*h).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round"/></svg>`;
}
function area(name,color,w=340,h=88){
  const d=seedArr(name+'a',30,.2,.75);
  const pts=d.map((v,i)=>[i/(d.length-1)*w,h-6-v*(h-14)]);
  const line=pts.map(p=>p.map(x=>x.toFixed(1)).join(',')).join(' ');
  const areaPts=line+` ${w},${h} 0,${h}`;
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block">
    <polygon points="${areaPts}" fill="${color}" opacity=".12"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.8"/>
  </svg>`;
}
function donut(segs){
  const R=34,CIRC=2*Math.PI*R;let off=0;
  const rings=segs.map(s=>{
    const len=s.v/100*CIRC;
    const el=`<circle r="${R}" cx="44" cy="44" fill="none" stroke="${s.c}" stroke-width="11"
      stroke-dasharray="${len.toFixed(1)} ${(CIRC-len).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 44 44)"/>`;
    off+=len;return el;
  }).join('');
  return `<svg width="88" height="88" viewBox="0 0 88 88" aria-hidden="true">${rings}</svg>`;
}

  this.textContent=exploded?'⇕ Compactar torre':'⇕ Expandir torre';
  if(SEL)focusFloor(SEL);else resetView();
};

/* ══════════ LOOP ══════════ */
function resize(){
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  POST.setSize();
}
addEventListener('resize',resize);resize();

let t=0;
const EASE=REDUCED?1:.085;
const posAttr=core.geometry.attributes.position;
function frame(){
  t+=.016;
  st.theta+=(des.theta-st.theta)*EASE;
  st.phi+=(des.phi-st.phi)*EASE;
  st.r+=(des.r-st.r)*EASE;
  st.tgt.lerp(des.tgt,EASE);
  gapCur+=(gapDes-gapCur)*EASE;
  layoutTower();
  if(!REDUCED){
    /* deriva idle */
    if(performance.now()-lastAct>7000&&SEL===null)des.theta+=.00045;
    /* núcleo: partículas ascienden */
    const h=8*gapCur+44;
    for(let i=0;i<NP;i++){
      let y=posAttr.array[i*3+1]+.35+cs[i]*.3;
      if(y>COREH)y=-8;
      posAttr.array[i*3+1]=y;
    }
    posAttr.needsUpdate=true;
    core.rotation.y=t*.25;
    /* pantallas: scroll del contenido */
    SCREEN_T.jade.offset.y=(t*.05)%1;
    SCREEN_T.warn.offset.y=(t*.033)%1;
    SCREEN_T.info.offset.y=(t*.02)%1;
    /* holograma de la sala */
    floorGroups.forEach(fg=>{if(fg.userData&&fg.userData.holo)fg.userData.holo.rotation.y=t*.5;});
  }
  applyCam();
  POST.setFocus(camera.position.distanceTo(st.tgt));
  POST.render(scene,camera);
  requestAnimationFrame(frame);
}
applyCam();frame();

/* Mode switch (contexto de integración con Akasha) */
(function(){
  var t=document.getElementById('toast'),tm;
  function toast(m){t.textContent=m;t.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){t.classList.remove('on');},3600);}
  document.getElementById('mUni').onclick=function(){toast('En el Satori OS este botón cambia a la Oficina Universo — la sala hermana de Akasha (orbe de clientes + Cerebro). Misma escena, otro modo. Acá mostramos el Edificio.');};
})();
window.__EDIF={PISOS,selectFloor,openDash:(pid,i)=>{const p=PISOS.find(x=>x.id===pid);openDash(p,p.ags[i]);},camera,renderer,THREEv:THREE.REVISION};
